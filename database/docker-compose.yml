services:
  postgres:
    image: postgres:16-alpine
    container_name: noctis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: noctis_db
      POSTGRES_USER: noctis_admin
      POSTGRES_PASSWORD: noctis_password_2026
    ports:
      - "5435:5432"
    volumes:
      - noctis_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noctis_admin -d noctis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  noctis_pgdata:
    name: noctis_pgdata
